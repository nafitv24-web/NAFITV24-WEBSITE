name: Build & Release NAFI TV 24 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Verify and Restore Source Integrity
        run: |
          python3 -c "
          import os, zlib
          path = 'app/src/main/java/com/example/ui/NafiTvMainApp.kt'
          if os.path.exists(path):
              with open(path, 'rb') as f:
                  raw = f.read()
              z_start = raw.find(b'x\x9c')
              if z_start != -1:
                  print('Detected compressed chunk in repo at index:', z_start)
                  first_part = raw[:z_start].decode('utf-8', errors='ignore')
                  second_part = zlib.decompress(raw[z_start:]).decode('utf-8', errors='ignore')
                  full_code = first_part + second_part
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(full_code)
                  print('Source integrity successfully auto-restored! Total lines:', len(full_code.splitlines()))
              else:
                  print('Source code is intact.')
          "

      - name: Setup Environment File
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx5120m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC\" -Dorg.gradle.workers.max=1 -Dorg.gradle.parallel=false -Dorg.gradle.configuration-cache=false -Dkotlin.compiler.execution.strategy=in-process"
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAFI-TV-24-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
